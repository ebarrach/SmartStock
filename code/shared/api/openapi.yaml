  "components": {
    "schemas": {
      "Product": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "name",
          "dataMatrix",
          "unitWeightGrams",
          "minStock"
        ],
        "properties": {
          "id": {
            "type": "string",
            "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"
          },
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 200
          },
          "dataMatrix": {
            "type": "string",
            "minLength": 1,
            "maxLength": 512
          },
          "unitWeightGrams": {
            "type": "number",
            "exclusiveMinimum": 0
          },
          "minStock": {
            "type": "integer",
            "minimum": 0,
            "description": "Seuil par emplacement enregistre: le stock armoire ne masque pas un sac insuffisant."
          }
        }
      },
      "Batch": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",

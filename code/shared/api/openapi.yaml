  "components": {
    "schemas": {
      "Product": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "name",
          "dataMatrix",
          "unitWeightGrams",
          "minStock"
        ],
        "properties": {
          "id": {
            "type": "string",
            "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"
          },
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 200
          },
          "dataMatrix": {
            "type": "string",
            "minLength": 1,
            "maxLength": 512
          },
          "unitWeightGrams": {
            "type": "number",
            "exclusiveMinimum": 0
          },
          "minStock": {
            "type": "integer",
            "minimum": 0,
            "description": "Seuil par emplacement enregistre: le stock armoire ne masque pas un sac insuffisant."
          }
        }
      },
      "Batch": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "productId",
          "location",
          "quantity",
          "expiresOn"
        ],
        "properties": {
          "id": {
            "type": "string",
            "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"
          },
          "productId": {
            "type": "string",
            "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"
          },
          "location": {
            "enum": [
              "cabinet",
              "bag"
            ]
          },
          "quantity": {
            "type": "integer",
            "minimum": 0,
            "maximum": 2147483647
          },
          "expiresOn": {
            "type": "string",
            "format": "date"
          }
        }
      },
      "Movement": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "batchId",
          "delta",
          "quantityAfter",
          "occurredAt",
          "eventId"
        ],
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "batchId": {
            "type": "string",
            "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"
          },
          "delta": {
            "type": "integer",
            "minimum": -2147483648,
            "maximum": 2147483647
          },
          "quantityAfter": {
            "type": "integer",
            "minimum": 0
          },
          "occurredAt": {
            "type": "string",
            "format": "date-time"
          },
          "eventId": {
            "type": "string",
            "format": "uuid"
          }
        }
      },
      "Reading": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "kind",
          "value",
          "source",
          "observedAt"
        ],
        "properties": {
          "kind": {
            "enum": [
              "temperature.measured",
              "humidity.measured",
              "infrared.detected",
              "fan.changed",
              "connection.changed",
              "sensor.failed"
            ]
          },
          "value": {
            "type": "number"
          },
          "source": {
            "type": "string",
            "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"
          },
          "observedAt": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "Alert": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "code",
          "subjectId",
          "message"
        ],
        "properties": {
          "code": {
            "type": "string"
          },
          "subjectId": {
            "type": "string"
          },
          "message": {
            "type": "string"
          }
        }
      },
      "Error": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "code",
          "message"
        ],
        "properties": {
          "code": {
            "type": "string"
          },
          "message": {
            "type": "string"
          }
        }
      },
      "Snapshot": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "products",
          "batches",
          "movements",
          "readings",
          "alerts",
          "simulated"
        ],
        "properties": {
          "products": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Product"
            }
          },
          "batches": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Batch"
            }
          },
          "movements": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Movement"
            }
          },
          "readings": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Reading"
            }
          },
          "alerts": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Alert"
            }
          },
          "simulated": {
            "type": "boolean"
          }
        }
      },
      "Envelope": {
        "title": "SmartStock event envelope v1 (S1 transport container)",
        "type": "object",
        "additionalProperties": false,
        "required": [
          "v",
          "id",
          "type",
          "src",
          "seq",
          "ts",
          "corr",
          "data"
        ],
        "properties": {
          "v": {
            "const": 1,
            "type": "integer"
          },
          "id": {
            "type": "string",
            "format": "uuid",
            "pattern": "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
          },
          "type": {
            "type": "string",
            "minLength": 1,
            "pattern": "\\S"
          },
          "src": {
            "type": "string",
            "minLength": 1,
            "pattern": "\\S"
          },
          "seq": {
            "type": "integer",
            "minimum": 0
          },
          "ts": {
            "type": "string",
            "format": "date-time",
            "pattern": "(Z|\\+00:00)$"
          },
          "corr": {
            "type": [
              "string",
              "null"
            ],
            "format": "uuid"
          },
          "data": {
            "type": "object"
          }
        }
      }
    }
  }
}

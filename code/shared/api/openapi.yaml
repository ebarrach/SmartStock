      "post": {
        "operationId": "createMovements",
        "parameters": [
          {
            "name": "X-Command-Id",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "required": [
                  "batchId",
                  "delta"
                ],
                "properties": {
                  "batchId": {
                    "type": "string",
                    "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"
                  },
                  "delta": {
                    "type": "integer"
                  },
                  "kind": {
                    "type": "string",
                    "enum": [
                      "consumption",
                      "replenishment",
                      "correction",
                      "loss",
                      "expiry"
                    ]
                  },
                  "source": {
                    "type": "string",
                    "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"
                  },
                  "reason": {
                    "type": "string",
                    "maxLength": 500
                  }
                },
                "description": "Sans type explicite : correction. Les observations capteurs valides produisent consommation ou reapprovisionnement. Les anciens mouvements restent legacy et ne sont jamais inferes comme consommation."
              }
            }
          }
        },

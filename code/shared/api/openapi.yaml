              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": false,
                  "required": [
                    "corr",
                    "status"
                  ],
                  "properties": {
                    "corr": {
                      "type": "string",
                      "format": "uuid"
                    },
                    "status": {
                      "enum": [
